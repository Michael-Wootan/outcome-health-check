name: Outcome Health Check

on:
  schedule:
    - cron: '15 14 1,15 * *'   # 1st and 15th of the month, 14:15 UTC
  workflow_dispatch:
    inputs:
      no_email:
        description: 'Build and save the report, do not email it'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    # Scheduled runs are off until the repository variable ENABLE_SCHEDULE is 'true',
    # so a fresh fork or an unconfigured copy never runs (or fails) on its own.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # The previous snapshot (for deltas) and the other automations' state files
      # travel in the Actions cache. Reports contain business figures, so they
      # are never committed to a public repository.
      - name: Restore snapshot and state
        uses: actions/cache/restore@v4
        with:
          path: |
            reports
            state
          key: outcome-health-${{ github.run_id }}
          restore-keys: |
            outcome-health-

      - name: Run the outcome health check
        run: node src/outcome-health-check.js ${{ inputs.no_email && '--no-email' || '' }}
        env:
          SHOPIFY_STORE:        ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN:  ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          AHREFS_API_TOKEN:     ${{ secrets.AHREFS_API_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_NOTIFY:         ${{ secrets.EMAIL_NOTIFY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          EXTRA_REPOS_TOKEN:    ${{ secrets.EXTRA_REPOS_TOKEN }}
          MONITOR_REPO:         ${{ vars.MONITOR_REPO }}
          EXTRA_REPOS:          ${{ vars.EXTRA_REPOS }}
          COMPANY_NAME:         ${{ vars.COMPANY_NAME }}
          SITE_DOMAIN:          ${{ vars.SITE_DOMAIN }}
          BUSINESS_DESCRIPTION: ${{ vars.BUSINESS_DESCRIPTION }}

      - name: Save snapshot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            reports
            state
          key: outcome-health-${{ github.run_id }}
